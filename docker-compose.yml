version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: facturamas-mongo
    environment:
      MONGO_INITDB_DATABASE: facturamas
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: facturamas-backend
    environment:
      MONGODB_URI: mongodb://mongo:27017
      DB_NAME: facturamas
      SERVER_PORT: 3000
      PDF_OUTPUT_DIR: /root/storage/pdfs
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "3000:3000"
    volumes:
      - pdf-data:/root/storage/pdfs
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: facturamas-frontend
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo-data:
  pdf-data:
